<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="favBg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="55%" stop-color="#240c4a"/>
      <stop offset="100%" stop-color="#0e041e"/>
    </radialGradient>
    <linearGradient id="favStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="45%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Neon Halo -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="#a855f7" stroke-width="4" opacity="0.6" filter="url(#favGlow)"/>

  <!-- Main Circle Badge -->
  <circle cx="64" cy="64" r="54" fill="url(#favBg)" stroke="url(#favStroke)" stroke-width="3"/>

  <!-- Stylized Capital Letter "A" matching uploaded navbar image -->
  <text x="64" y="80" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Plus Jakarta Sans', sans-serif" 
        font-size="54" 
        font-weight="800" 
        fill="#ffffff"
        letter-spacing="-0.02em">A</text>
</svg>

